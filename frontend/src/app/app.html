<header class="top-bar">
  <div class="brand">
    <h1 class="title">{{ title() }}</h1>
    <span
      class="version"
      data-testid="backend-version"
      [class.unknown]="backend().state === 'unknown'"
      [attr.aria-label]="backend().state === 'known' ? 'backend version ' + versionText() : null"
      >{{ versionText() }}</span
    >
    @if (greetingLine(); as line) {
      <span class="greeting" data-testid="greeting">{{ line }}</span>
    }
  </div>
  <app-theme-control />
</header>
<main class="stage">
  <app-dashboard />
</main>
