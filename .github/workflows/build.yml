name: Release Docker & Helm
on:
  release:
    types: [published]

env:
  GO_VERSION: '1.27.3'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  attestations: write

jobs:
  build:
    name: Build Docker Image (${{ matrix.component }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Docker meta
        id: tag_names
        uses: docker/metadata-action@v6
        with:
          images: |
            guidedtraffic/dash-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=dash-${{ matrix.component }}
            org.opencontainers.image.description=Dash ${{ matrix.component }} - the Kubernetes start page
            org.opencontainers.image.vendor=Guided Traffic
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://github.com/guided-traffic/dash
            org.opencontainers.image.source=https://github.com/guided-traffic/dash

      - name: Get current epoch time
        id: time
        run: echo "epoch=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Extract version without v prefix
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: ${{ matrix.component }}/Containerfile
          context: ${{ matrix.component }}
          build-args: |
            BUILD_NUMBER=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.epoch }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag_names.outputs.tags }}
          labels: ${{ steps.tag_names.outputs.labels }}
          provenance: true
          sbom: true

      - name: Generate and upload SBOM
        uses: anchore/sbom-action@v0
        with:
          image: guidedtraffic/dash-${{ matrix.component }}:${{ steps.version.outputs.version }}
          format: spdx-json
          upload-artifact: true
          upload-release-assets: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.workspace }}/guidedtraffic-dash-${{ matrix.component }}_*.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Scout scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: guidedtraffic/dash-${{ matrix.component }}:${{ steps.version.outputs.version }}
          sarif-file: scout-report.sarif
          summary: true
          dockerhub-user: guidedtraffic
          dockerhub-password: ${{ secrets.DOCKERHUB_PAT }}

  release-helm-gh:
    name: Release Helm Chart to GitHub Pages
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The pinned Helm of the Makefile, built with Go into bin/.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Package the chart at the release version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          make helm-package CHART_VERSION="${VERSION}" HELM_REPO_DIR="$RUNNER_TEMP/helm-charts"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Pages
        run: |
          cp "$RUNNER_TEMP"/helm-charts/*.tgz gh-pages/
          # The index of every release so far, merged with the new package; a first release has none.
          merge=""
          if [ -f gh-pages/index.yaml ]; then merge="$PWD/gh-pages/index.yaml"; fi
          make helm-index HELM_REPO_DIR="$PWD/gh-pages" HELM_INDEX_MERGE="$merge"
          cd gh-pages
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add --force *.tgz index.yaml
          git commit -m "Release Helm chart for $GITHUB_REF_NAME"
          git push origin gh-pages

      # Only this release's own package belongs on the release; index.yaml is the
      # full repository index, a restorable snapshot of gh-pages.
      - name: Update Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            gh-pages/dash-${{ steps.version.outputs.version }}.tgz
            gh-pages/index.yaml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
