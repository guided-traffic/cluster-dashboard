# The two logo catalogues publish no release, tag or package (checked 2026-10-26): each is pinned to
# a commit of its repository and the SHA-256 of the files a pack is built from — svg/ and the index —
# as `find svg <index> -type f | LC_ALL=C sort | xargs sha256sum | sha256sum` prints it in a
# checkout (docs/adr/0008). Renovate moves the commits weekly (renovate.json); its pull request fails
# the image build until `make icon-pins` has printed the new SHA-256 and it is put here.
