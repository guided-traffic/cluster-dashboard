# golangci-lint for the backend module, cowork's set (make lint).
version: "2"

run:
  allow-parallel-runners: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - goconst
    - prealloc
    - revive

  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code

    goconst:
      min-len: 3
      min-occurrences: 3

    errcheck:
      # Usage and version text goes to stdout/stderr; a failed write there has
      # no handler that could do better than the exit code already does.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    generated: strict
    rules:
      # Tests repeat literals and leave errors of a recorder unchecked.
      - path: _test\.go
        linters:
          - errcheck
          - goconst

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/guided-traffic/dash/backend
