# Dash in the end-to-end cluster: the images of make docker-build, loaded into kind (hack/e2e.sh
# sets repository and tag), both Ingress objects with TLS on localhost, cert-manager's issuer
# annotation on the frontend's object only and the secret named by both — the split the chart's
# README recommends.
backend:
  image:
    pullPolicy: Never
frontend:
  image:
    pullPolicy: Never
ingress:
  enabled: true
  className: haproxy
  hosts:
    - localhost
  tls:
    - secretName: dash-tls
      hosts:
        - localhost
  frontend:
    annotations:
      cert-manager.io/cluster-issuer: selfsigned
# Every Ingress shows unless it opts out: Dash's own two objects carry the opt-out the chart puts on
# them, and the suite proves they stay off the dashboard.
discovery:
  defaultEnable: true
# The suite waits for changes: a poll every five seconds. The greeting welcomes to an environment
# under an orange scanner, which the suite checks moving and standing still.
ui:
  refreshSeconds: 5
  greeting:
    environment: staging
  lightStrip:
    color: orange
    animation: scanner
# A custom app whose logo auto-match finds in the image's packs, and a bookmark whose icon is a key
# of the chart's icon ConfigMap: the suite fetches both icons through the backend's Ingress.
apps:
  - group: e2e
    apps:
      - name: Headlamp
        url: https://headlamp.example.com
bookmarks:
  - group: e2e
    bookmarks:
      - name: ConfigMap icon
        url: https://example.com
        icon: configmap:e2e.svg
        badges:
          - text:cm@bottom-left
icons:
  # The seed's remote icon comes from the frontend's Service, inside the cluster, over plain http.
  remote:
    allowedHosts:
      - dash-frontend.dash.svc.cluster.local
  configMap:
    files:
      e2e.svg: PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTAiIGZpbGw9IiM0YWE4ZmYiLz48L3N2Zz4=
# Badge rules: the backend then watches IngressClasses, under the ClusterRole the chart adds — the
# backend turns ready only if that grant works. The haproxy controller's apps get the house, the
# class without a controller and the custom app on example.com the globe.
badges:
  definitions:
    world:
      icon: material-symbols:public
      label: reachable worldwide
      tone: cyan
    home:
      icon: material-symbols:home
      label: local network only
    beta:
      text: beta
      label: beta release
      tone: amber
  rules:
    - match:
        hosts: ["*.example.com"]
        kinds: [app]
      badge: world
    - match:
        ingressClassNames: [external]
      badge: world
    - match:
        ingressControllers: [haproxy-ingress.github.io/controller]
      badge: home
