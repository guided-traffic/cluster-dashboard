# The end-to-end cluster (make e2e): one node, labelled for the Ingress controller, whose ports
# 443 and 80 reach the host's loopback address only. hack/e2e.sh replaces E2E_PORT.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 443
        hostPort: E2E_PORT
        listenAddress: 127.0.0.1
        protocol: TCP
