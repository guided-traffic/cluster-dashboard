apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dash.backend.fullname" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "dash.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dash.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dash.serviceAccountName" . }}
      # The token is how the backend reaches the Kubernetes API.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "dash.podSecurityContext" . | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "dash.image" (dict "root" . "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args: ["serve"]
          env:
            - name: DASH_CONFIG
              value: /etc/dash/config.yaml
            - name: DASH_LISTEN_ADDR
              value: ":8080"
            - name: DASH_LOG_LEVEL
              value: {{ .Values.backend.logLevel | quote }}
            # The Go runtime's soft memory limit: the container's limit, so the collector works
            # harder before the kernel would kill the container.
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: backend
                  resource: limits.memory
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "dash.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/dash
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "dash.config.fullname" . }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
