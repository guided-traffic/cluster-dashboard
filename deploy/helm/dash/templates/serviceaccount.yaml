{{- if .Values.serviceAccount.create -}}
# The backend's identity towards the Kubernetes API. Phase 1 asks the API server for its version
# only, which needs no role; the discovery's roles arrive with phase 2.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dash.serviceAccountName" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
