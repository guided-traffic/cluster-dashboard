{{- if .Values.serviceAccount.create -}}
# The backend's identity towards the Kubernetes API: the version probe needs no role, the
# discovery's read is templates/rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dash.serviceAccountName" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
