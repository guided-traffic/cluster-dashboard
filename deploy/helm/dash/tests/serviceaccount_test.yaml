suite: the backend's ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: dash
tests:
  - it: is created by default as <fullname>-backend
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: dash-backend

  - it: takes a name and annotations from the values
    set:
      serviceAccount.name: dash-reader
      serviceAccount.annotations:
        example.com/role: reader
    asserts:
      - equal:
          path: metadata.name
          value: dash-reader
      - equal:
          path: metadata.annotations["example.com/role"]
          value: reader

  - it: is not rendered when the chart creates none
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
